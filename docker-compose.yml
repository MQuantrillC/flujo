# Flujo en una máquina (por ejemplo una e2-micro de Google Cloud):
#
#   docker compose pull && docker compose up -d
#
# - `flujo`: la app, con la base y los adjuntos en ./data (fuera del contenedor,
#   sobreviven a cada actualización).
# - `caddy`: la puerta de entrada. Con FLUJO_DOMINIO en .env sirve HTTPS con
#   certificado automático; sin dominio, sirve por HTTP en el puerto 80 (y hay
#   que poner FLUJO_SIN_HTTPS=1 para que la sesión funcione por IP).

services:
  flujo:
    # La imagen la construye GitHub (.github/workflows/imagen.yml). En la máquina:
    #   docker compose pull && docker compose up -d
    # Si se quiere construir en el sitio: docker compose up -d --build
    image: ghcr.io/mquantrillc/flujo:latest
    build: .
    restart: unless-stopped
    environment:
      FLUJO_SIN_HTTPS: ${FLUJO_SIN_HTTPS:-0}
      # Correos de invitación (opcional): ver .env.example.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FLUJO_REMITENTE: ${FLUJO_REMITENTE:-}
      FLUJO_URL: ${FLUJO_URL:-}
    volumes:
      - ./data:/data
    expose:
      - "3100"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FLUJO_DOMINIO: ${FLUJO_DOMINIO:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - flujo

volumes:
  caddy_data:
  caddy_config:
