# En cada cambio a main, GitHub construye la imagen de Flujo y la publica en
# ghcr.io/mquantrillc/flujo:latest. La máquina donde corre la app sólo la
# descarga (docker compose pull), sin construir nada.
name: imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mquantrillc/flujo:latest
            ghcr.io/mquantrillc/flujo:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/MQuantrillC/flujo
          cache-from: type=gha
          cache-to: type=gha,mode=max
